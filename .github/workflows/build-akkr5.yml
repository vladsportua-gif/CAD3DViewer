name: Build AKKR5 Android APK
on:
  push:
    branches: [akkr5-android-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android project
        run: unzip -q AKKR5-Android-App-Source.zip -d build-source
      - name: Build installable debug APK
        working-directory: build-source/AKKR5-Android
        run: | 
          FILE=app/src/main/java/com/cadviewer/mobile/MainActivity.kt
          awk '$0=="import android.webkit.WebView" {if (seen++) next} {print}' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"
          gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKKR5-Installable-APK
          path: build-source/AKKR5-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
